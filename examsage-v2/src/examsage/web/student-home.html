<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的课程 · 押题宝</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; background: #f7f8f3; color: #172d36; font: 16px/1.6 system-ui, sans-serif }
    header { padding: 1rem clamp(1rem, 5vw, 4rem); border-bottom: 1px solid #dbe2db; background: white; font-size: 1.25rem; font-weight: 700 }
    main { max-width: 58rem; margin: auto; padding: 2.4rem 1rem 4rem }
    .toolbar, li { display: flex; align-items: center; justify-content: space-between; gap: 1rem }
    h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.4rem); line-height: 1.25 }
    h2 { margin: 2rem 0 .65rem; font-size: 1rem; color: #526568; font-weight: 600 }
    ul { padding: 0; margin: 0; list-style: none; border: 1px solid #dbe2db; border-radius: .65rem; background: white }
    li { padding: .85rem 1rem }
    li + li { border-top: 1px solid #e8ece6 }
    a { color: #176850 }
    a:focus-visible { outline: 3px solid #4b9892; outline-offset: 3px }
    .enter { font-weight: 600; overflow-wrap: anywhere }
    .reader { font-size: .875rem; white-space: nowrap }
    .import { padding: .55rem 1rem; background: #176850; color: white; border-radius: .5rem; text-decoration: none }
    .empty { margin-top: 2rem }
    @media(max-width: 30rem) { li { flex-wrap: wrap } }
  </style>
</head>
<body>
  <header>押题宝</header>
  <main>
    <div class="toolbar"><h1>我的课程</h1><a class="import" href="/import/">导入课件</a></div>
    {{student_courses}}
  </main>
</body>
</html>
