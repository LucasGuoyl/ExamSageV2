[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "examsage-v2"
version = "2.0.0a1"
description = "Evidence-first course data and retrieval for ExamSage"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2.8,<3", "pypdf>=6,<7", "pypdfium2>=5,<6", "Pillow>=11,<13", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "starlette>=0.44"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
examsage = "examsage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
examsage = ["paper_topics.json", "web/*.html", "web/*.js", "web/*.css", "web/vendor/katex/*", "web/vendor/katex/contrib/*", "web/vendor/katex/fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
